name: Hourly Stock Radar Bot

on:
  schedule:
    - cron: '0 * * * *'  # 每小時自動執行一次
  workflow_dispatch:

jobs:
  run-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允許自動 commit seen_news 記錄

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install feedparser requests google-genai

      - name: Run Python Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit seen cache
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update seen news cache [skip ci]'
          file_pattern: seen_news.json
